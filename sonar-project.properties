# SonarQube / SonarCloud Configuration for EventHub
# Cumplimiento Eje B - Quality Gate de Análisis Estático

sonar.projectKey=EventHub
sonar.projectName=EventHub
sonar.projectVersion=1.0.0

# Source & Test paths
sonar.sources=apps/api/src,apps/web/src
sonar.tests=apps/api/test,apps/api/src,apps/web/e2e
sonar.test.inclusions=**/*.spec.ts,**/*.e2e-spec.ts

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/reports/**,**/docs/**,**/*.json
sonar.coverage.exclusions=**/*.spec.ts,**/*.e2e-spec.ts,apps/api/src/openapi.ts,apps/api/src/modules/events/event.seed.ts

# LCOV Coverage Report
sonar.javascript.lcov.reportPaths=apps/api/coverage/lcov.info

# Encoding
sonar.sourceEncoding=UTF-8

# Quality Gate criteria (umbral de cátedra):
# - 0 Blocker / Critical bugs
# - 0 Vulnerabilities
# - Duplicación <= 3%
# - Rating A en Confiabilidad y Seguridad
# - 100% Security Hotspots revisados
# - Cobertura >= 80% líneas y >= 70% ramas

