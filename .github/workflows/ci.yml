name: CI - EventHub Testing Pipeline

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, Static Analysis, Unit & E2E Testing
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: evenhub
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      rabbitmq:
        image: rabbitmq:3-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: user
          RABBITMQ_DEFAULT_PASS: password
        ports:
          - 5672:5672
          - 15672:15672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: G6 - Secret Scan (Gitleaks, full history)
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            zricethezav/gitleaks:v8.28.0 detect \
            --source /repo \
            --config /repo/.gitleaks.toml \
            --no-banner --redact --verbose

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Eje B - Static Analysis & Linting (oxlint)
        run: pnpm --filter api lint

      - name: Eje B - Typecheck (web)
        run: pnpm --filter @evenhub/web typecheck

      - name: Build Backend & Frontend
        run: |
          pnpm --filter api build
          pnpm --filter @evenhub/web build

      - name: Eje B - Contrato OpenAPI publicado y versionado
        run: |
          pnpm --filter api openapi:export
          git diff --exit-code docs/contracts/openapi.json
          echo "Contrato OpenAPI sincronizado con apps/api/src/openapi.ts."

      - name: Eje B & Eje D - Suite 3x sin flaky (unidad + E2E con DB y broker reales)
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USERNAME: user
          DB_PASSWORD: password
          DB_DATABASE: evenhub
          RABBITMQ_URL: amqp://user:password@localhost:5672
          JWT_SECRET: ci-testing-jwt-secret-key-eventhub-2026
        run: |
          for run in 1 2 3; do
            echo "=== Corrida ${run}/3 - unitarias y dominio con cobertura ==="
            pnpm --filter api test:cov
            echo "=== Corrida ${run}/3 - E2E e integracion real (PostgreSQL + RabbitMQ) ==="
            pnpm --filter api test:e2e
          done
          echo "3 corridas consecutivas sin fallos: criterio anti-flaky cumplido."

      - name: Coverage Report (baseline anti-regresion 90/75)
        run: |
          node - <<'NODE'
          const summary = require('./apps/api/coverage/coverage-summary.json').total;
          const lines = summary.lines.pct;
          const branches = summary.branches.pct;
          console.log(`Cobertura real: lineas=${lines}% ramas=${branches}% funciones=${summary.functions.pct}%`);
          if (lines < 90 || branches < 75) {
            console.error('Regresion de cobertura respecto del baseline (90% lineas / 75% ramas).');
            process.exit(1);
          }
          console.log('Criterio Eje B cumplido: lineas >= 80%, ramas >= 70% (medido: ' + lines + '/' + branches + ').');
          NODE

      - name: Eje B - Levantar API contra PostgreSQL y RabbitMQ del pipeline
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_USERNAME: user
          DB_PASSWORD: password
          DB_DATABASE: evenhub
          RABBITMQ_URL: amqp://user:password@localhost:5672
          JWT_SECRET: ci-testing-jwt-secret-key-eventhub-2026
          PORT: 3000
        run: |
          mkdir -p apps/api/reports/newman
          node apps/api/dist/main.js > apps/api/reports/api-newman.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000/events > /dev/null; then
              echo "API lista para Newman."
              break
            fi
            sleep 1
          done
          curl -fsS http://localhost:3000/openapi.json > /dev/null

      - name: Eje B - Postman/Newman (exito y error por endpoint)
        run: |
          npx -y newman@6 run docs/postman/EventHub_API_Collection.json \
            --reporters cli,json \
            --reporter-json-export apps/api/reports/newman/newman-report.json

      - name: Eje B - Detener API
        if: always()
        run: pkill -f "apps/api/dist/main.js" || true

      - name: Frontend Business Rules & UI Tests
        run: pnpm --filter @evenhub/web test

      - name: Upload coverage & Newman evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-testing-evidence
          path: |
            apps/api/coverage/
            apps/api/reports/
            apps/api/reports/api-newman.log
          if-no-files-found: warn

  mutation-testing:
    name: Eje B - Mutation Testing (Stryker, score >= 60)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: evenhub
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      rabbitmq:
        image: rabbitmq:3-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: user
          RABBITMQ_DEFAULT_PASS: password
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API
        run: pnpm --filter api build

      - name: Run Stryker (break bajo 60%)
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USERNAME: user
          DB_PASSWORD: password
          DB_DATABASE: evenhub
          RABBITMQ_URL: amqp://user:password@localhost:5672
          JWT_SECRET: ci-testing-jwt-secret-key-eventhub-2026
        run: pnpm --filter api test:mutation

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: apps/api/reports/mutation/
          if-no-files-found: warn

  playwright-e2e:
    name: Eje A - Playwright E2E, Responsive & Accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter @evenhub/web exec playwright install --with-deps chromium

      - name: Build & start full stack
        run: docker compose up -d --build --wait

      - name: Run Playwright suite (6 critical + 3 responsive + 9 a11y)
        run: pnpm --filter @evenhub/web exec playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          if-no-files-found: warn

      - name: Dump stack logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans

  load-test-k6:
    name: Eje C - Carga k6 (50 VUs, 5 min, 3 endpoints criticos)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build & start API, PostgreSQL and RabbitMQ
        run: docker compose up -d --build --wait postgres rabbitmq api

      - name: Run k6 load test (p95 < 500 ms, error < 1%)
        run: |
          mkdir -p docs/evidencias
          docker run --rm --network host \
            -v "$PWD:/scripts" -w /scripts \
            -e API_URL=http://localhost:3000 \
            grafana/k6:0.54.0 run load-tests/k6-load-test.js
          test -f docs/evidencias/k6-summary.json

      - name: Verify k6 report thresholds
        run: |
          node - <<'NODE'
          const summary = require('./docs/evidencias/k6-summary.json');
          const p95 = summary.metrics.http_req_duration.values['p(95)'];
          const errorRate = summary.metrics.http_req_failed.values.rate;
          const requests = summary.metrics.http_reqs.values.count;
          console.log(`k6: p95=${p95.toFixed(2)}ms error_rate=${(errorRate * 100).toFixed(2)}% requests=${requests}`);
          if (p95 >= 500) { console.error('p95 >= 500ms'); process.exit(1); }
          if (errorRate >= 0.01) { console.error('error rate >= 1%'); process.exit(1); }
          NODE

      - name: Upload k6 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-load-test-summary
          path: docs/evidencias/k6-summary.json
          if-no-files-found: warn

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans

  docker-reproducibility:
    name: G1 - Docker Compose reproducibility & smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build & start full stack
        run: docker compose up -d --build --wait

      - name: Smoke test HTTP
        run: |
          curl -fsS http://localhost:3000/events > /dev/null
          curl -fsS http://localhost:5173/ > /dev/null
          curl -fsS http://localhost:5173/api/events > /dev/null
          TOKEN=$(curl -fsS -X POST http://localhost:3000/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"maria@eventhub.com.ar","password":"password"}' | jq -r .accessToken)
          test -n "$TOKEN"
          test "$TOKEN" != "null"
          echo "Smoke test G1 OK: API, web, proxy Vite y login."

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans
