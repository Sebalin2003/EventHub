name: CI - EventHub Testing Pipeline

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, Static Analysis, Unit & E2E Testing
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: evenhub
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      rabbitmq:
        image: rabbitmq:3-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: user
          RABBITMQ_DEFAULT_PASS: password
        ports:
          - 5672:5672
          - 15672:15672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: G6 - Secret Scan (Gitleaks, full history)
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            zricethezav/gitleaks:v8.28.0 detect \
            --source /repo \
            --config /repo/.gitleaks.toml \
            --no-banner --redact --verbose

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Eje B - Static Analysis & Linting (oxlint)
        run: pnpm --filter api lint

      - name: Eje B - Typecheck (web)
        run: pnpm --filter @evenhub/web typecheck

      - name: Build Backend & Frontend
        run: |
          pnpm --filter api build
          pnpm --filter @evenhub/web build

      - name: Eje B & Eje D - Unit, Domain & Security Tests with Coverage
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USERNAME: user
          DB_PASSWORD: password
          DB_DATABASE: evenhub
          RABBITMQ_URL: amqp://user:password@localhost:5672
          JWT_SECRET: ci-testing-jwt-secret-key-eventhub-2026
        run: pnpm --filter api test:cov

      - name: Coverage Report (informativo + baseline anti-regresion)
        run: |
          node - <<'NODE'
          const summary = require('./apps/api/coverage/coverage-summary.json').total;
          const lines = summary.lines.pct;
          const branches = summary.branches.pct;
          console.log(`Cobertura real: lineas=${lines}% ramas=${branches}% funciones=${summary.functions.pct}%`);
          console.log('Objetivo de catedra: lineas >= 80%, ramas >= 70% (todavia pendiente).');
          if (lines < 73 || branches < 51) {
            console.error('Regresion de cobertura respecto del baseline (73% lineas / 51% ramas).');
            process.exit(1);
          }
          console.log('Baseline anti-regresion OK.');
          NODE

      - name: Eje A - 5 Critical Automated Scenarios (E2E)
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USERNAME: user
          DB_PASSWORD: password
          DB_DATABASE: evenhub
          RABBITMQ_URL: amqp://user:password@localhost:5672
          JWT_SECRET: ci-testing-jwt-secret-key-eventhub-2026
        run: pnpm --filter api test:e2e

      - name: Frontend Business Rules & UI Tests
        run: pnpm --filter @evenhub/web test

      - name: Upload coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage
          path: apps/api/coverage/
          if-no-files-found: warn

  playwright-e2e:
    name: Eje A - Playwright E2E, Responsive & Accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter @evenhub/web exec playwright install --with-deps chromium

      - name: Build & start full stack
        run: docker compose up -d --build --wait

      - name: Run Playwright suite (5 critical + 3 responsive + 6 a11y)
        run: pnpm --filter @evenhub/web exec playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          if-no-files-found: warn

      - name: Dump stack logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans

  docker-reproducibility:
    name: G1 - Docker Compose reproducibility & smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build & start full stack
        run: docker compose up -d --build --wait

      - name: Smoke test HTTP
        run: |
          curl -fsS http://localhost:3000/events > /dev/null
          curl -fsS http://localhost:5173/ > /dev/null
          curl -fsS http://localhost:5173/api/events > /dev/null
          TOKEN=$(curl -fsS -X POST http://localhost:3000/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"maria@eventhub.com.ar","password":"password"}' | jq -r .accessToken)
          test -n "$TOKEN"
          test "$TOKEN" != "null"
          echo "Smoke test G1 OK: API, web, proxy Vite y login."

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans
