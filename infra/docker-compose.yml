version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: evenhub_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: evenhub
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: evenhub_broker
    environment:
      RABBITMQ_DEFAULT_USER: user
      RABBITMQ_DEFAULT_PASS: password
    ports:
      - '5672:5672'
      - '15672:15672'
  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    container_name: eventhub_api
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USERNAME=user
      - DB_PASSWORD=password
      - DB_DATABASE=evenhub
      - RABBITMQ_URL=amqp://user:password@rabbitmq:5672
      - PORT=3000
    ports:
      - '3000:3000'
    depends_on:
      - postgres
      - rabbitmq
    restart: unless-stopped

volumes:
  pgdata:
