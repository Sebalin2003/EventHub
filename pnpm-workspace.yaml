packages:
  - 'apps/*'

# Eje D: versiones parcheadas de dependencias transitivas con CVE alta/critica.
# Se mantiene la version mayor para no romper la API de los consumidores.
minimumReleaseAgeExclude:
  - brace-expansion@5.0.13
  - vite@8.3.8

overrides:
  # Runtime de la API
  multer: 2.5.0
  proxy-addr: 2.0.8
  body-parser: 2.4.0
  qs: 6.17.1
  follow-redirects: 1.16.3
  # Herramientas de desarrollo y pruebas
  undici: 6.29.1
  brace-expansion: 5.0.13
  source-map-js: 1.2.2
  fast-uri: 3.1.9
  vite: 8.3.8
  vitest: 4.1.12
  '@vitest/coverage-v8': 4.1.12
  '@vitest/mocker': 4.1.12
  tmp: 0.2.7
