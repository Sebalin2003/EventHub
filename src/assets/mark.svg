<svg width="96" height="96" viewBox="0 0 96 96" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="EventHub">
  <!-- Ticket body -->
  <rect x="6" y="24" width="84" height="48" rx="4" fill="#1B2A4A"/>

  <!-- Perforation notches marking the tear line -->
  <circle cx="66" cy="24" r="6" fill="#F5F3EE"/>
  <circle cx="66" cy="72" r="6" fill="#F5F3EE"/>

  <!-- Dashed tear line -->
  <line x1="66" y1="32" x2="66" y2="64" stroke="#F5F3EE" stroke-width="2" stroke-dasharray="4 4" stroke-linecap="round"/>

  <!-- Hub node: the single, decisive accent -->
  <circle cx="76" cy="48" r="6" fill="#E86A2C"/>
</svg>
