# Web de EventHub en Docker Compose (Eje D: cabeceras de seguridad).
server {
    listen 5173;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # DNS interno de Docker: el nombre "api" se resuelve en cada request,
    # así nginx arranca aunque la API todavía no esté lista.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:3000;

    # Cabeceras de seguridad en todas las respuestas (también en errores).
    # Orígenes externos permitidos: imágenes de Unsplash y tipografías de Google Fonts.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://images.unsplash.com; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # /api/* -> API sin el prefijo. Se ocultan las cabeceras de la API que nginx ya agrega,
    # para no duplicarlas.
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Cross-Origin-Opener-Policy;
        proxy_hide_header Cross-Origin-Embedder-Policy;
        proxy_hide_header Cross-Origin-Resource-Policy;
        proxy_hide_header X-XSS-Protection;
    }

    # Archivos con hash en el nombre: se pueden cachear sin límite.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # SPA: cualquier otra ruta devuelve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
